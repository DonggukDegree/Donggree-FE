name: lint&build check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment PR source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$PR_HEAD_REF" != "dev" ] || [ "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::main 대상 배포 PR은 같은 저장소의 dev 브랜치에서만 생성해야 합니다."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          standalone: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
